# Build the site and publish it with GitHub Pages (official upload-pages-artifact + deploy-pages flow).
# Runs only once the repository exists on GitHub and Settings → Pages → Source is set to "GitHub Actions".
# Actions are pinned to full commit SHAs (tag in the comment); update them deliberately, one PR at a time.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        # CI uses its own package store.
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-store"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Fetch media
        # Video files are GitHub Release assets of this repository (src/data/media.lock.json); fails when one is
        # missing or does not match its sha256. The token lets it read releases of a private repository.
        run: pnpm fetch:media
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build
        # site / base come from site.config.mjs (SITE_URL). The synced docs are committed, so no other repository
        # is needed here.
        run: pnpm build

      - name: Check internal links
        run: pnpm check:links

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
